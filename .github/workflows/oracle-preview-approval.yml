name: Verify Oracle Preview public approval
on:
  push:
    branches:
      - security/oracle-preview-trust
  pull_request:
    branches:
      - security/oracle-preview-trust
permissions:
  contents: read
jobs:
  oracle-preview-approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate public commitment only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          manifest = pathlib.Path("ops-approval/preview.json")
          data = json.loads(manifest.read_text(encoding="ascii"))
          assert type(data) is dict
          assert set(data) == {"version","scope","private_commit_commitment"}
          assert type(data["version"]) is int and data["version"] == 1
          assert data["scope"] == "mosaic-oracle-preview-root-only"
          assert type(data["private_commit_commitment"]) is str
          assert re.fullmatch("[a-f0-9]{64}", data["private_commit_commitment"])
          assert (manifest.read_bytes() ==
            (json.dumps(data, sort_keys=True, separators=(",",":"))+"\n").encode("ascii"))
          print("ORACLE_PREVIEW_PUBLIC_COMMITMENT_VALID")
          PY
