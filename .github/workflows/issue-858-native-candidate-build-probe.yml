name: Issue 858 Candidate Build Typecheck Probe
# Non-deployment verification of the clean task candidate source tree.
on:
  push:
    branches:
      - chatgpt/858-native-candidate-build-probe-20261018
permissions:
  contents: read
jobs:
  build-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: life-tracker
    env:
      VERCEL_ENV: preview
      VITE_APPWRITE_PROJECT_ID: 6a96e82d000d1310b3be
      VITE_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      VITE_APPWRITE_MESSAGE_ACTION_FUNCTION_ID: 6aa8057f002a4c306fdd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Compile TypeScript, Vite production build, PWA and size assertions
        run: npm run build
