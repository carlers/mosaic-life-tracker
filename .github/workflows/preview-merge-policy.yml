name: Preview merge policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  preview-squash-policy:
    name: Preview squash policy
    if: >-
      startsWith(github.event.pull_request.base.ref, 'feature/')
      && (startsWith(github.event.pull_request.head.ref, 'chatgpt/')
      || startsWith(github.event.pull_request.head.ref, 'codex/'))
    runs-on: ubuntu-latest
    steps:
      - name: Require squash merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          count="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100" \
            --jq 'length' | awk '{ total += $1 } END { print total + 0 }')"

          if [ "$count" -gt 1 ]; then
            echo "::error::Preview PRs from chatgpt/* or codex/* must be squash-merged. Configure the PR to use Squash and merge."
            echo "This repository policy is intended to keep one feature-level commit on stable Preview branches."
            exit 1
          fi

          echo "Preview PR commit count: $count"
          echo "The PR is eligible for the repository's squash-only Preview merge rule."
