name: Issue 858 Calendar Paired Mount Lab

# Independent synthetic A/B. A disposable CI checkout; never deployed.
on:
  push:
    branches:
      - chatgpt/858-local-mount-prototype-20261017
    paths:
      - 'life-tracker/tests/e2e/startup-calendar-paired-ab.spec.mjs'
      - 'life-tracker/scripts/issue-858-calendar-ab.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: life-tracker
    env:
      VERCEL_ENV: preview
      VITE_APPWRITE_PROJECT_ID: 6a96e82d000d1310b3be
      VITE_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      VITE_APPWRITE_MESSAGE_ACTION_FUNCTION_ID: 6aa8057f002a4c306fdd
      MOSAIC_AUDIT_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm install --prefix tests/e2e --package-lock=false --no-audit --no-fund
      - run: tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Build deliberately throwaway two-variant diagnostic
        run: |
          node scripts/issue-858-calendar-ab.mjs
          npx tsc -b && npx vite build
          node scripts/complete-precache-sizes.mjs
          node scripts/check-service-worker.mjs
          node scripts/check-build-asset-fingerprint.mjs
      # Not a deployable build, because legacy + candidate TaskBlock inflate the bundle.
      # Preserve all existing shipped-build hard budgets in the canonical workflow.
      - name: Interleave both Calendar variants with identical IndexedDB state
        run: tests/e2e/node_modules/.bin/playwright test tests/e2e/startup-calendar-paired-ab.spec.mjs --config=playwright.mobile-audit.config.mjs --reporter=line
      - name: Archive raw data and partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-858-calendar-paired-ab
          path: |
            life-tracker/.mosaic/slow-startup/calendar-volume-*.json
            life-tracker/test-results/**
          if-no-files-found: warn
          retention-days: 14
