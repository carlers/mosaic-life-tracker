name: Issue 858 Suspense Reveal A-B Lab

on:
  push:
    branches: [chatgpt/858-suspense-reveal-ab-20261017]
    paths:
      - 'life-tracker/src/App.tsx'
      - 'life-tracker/src/lib/homePreload.ts'
      - 'life-tracker/tests/e2e/startup-suspense-reveal-ab.spec.mjs'
      - '.github/workflows/issue-858-suspense-reveal-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suspense-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: life-tracker
    env:
      VERCEL_ENV: preview
      VITE_APPWRITE_PROJECT_ID: 6a96e82d000d1310b3be
      VITE_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      VITE_APPWRITE_MESSAGE_ACTION_FUNCTION_ID: 6aa8057f002a4c306fdd
      MOSAIC_AUDIT_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm install --prefix tests/e2e --package-lock=false --no-audit --no-fund
      - run: tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - run: npm run build
      - name: Paired cached Calendar React lazy versus direct module experiment
        run: tests/e2e/node_modules/.bin/playwright test tests/e2e/startup-suspense-reveal-ab.spec.mjs --config=playwright.mobile-audit.config.mjs --reporter=line
      - name: Archive synthetic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-858-suspense-reveal-ab
          path: |
            life-tracker/.mosaic/slow-startup/calendar-volume-*.json
            life-tracker/test-results/**
          if-no-files-found: warn
          retention-days: 14
