name: Branch Hygiene

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List eligible branches without deleting them
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: mosaic-branch-hygiene
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune merged branches after 72 hours
    if: ${{ github.repository == 'carlers/mosaic-life-tracker' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out approved cleanup policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect and prune eligible branches
        working-directory: life-tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node scripts/cleanup-merged-branches.mjs
