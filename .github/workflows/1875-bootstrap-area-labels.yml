name: One-time Mosaic area-label bootstrap

# One-time owner-authorized repository-label setup on a dedicated task branch.
# Never merge this temporary workflow into dev, main, or stable Preview.
on:
  push:
    branches:
      - chatgpt/1875-area-label-bootstrap-20261109
    paths:
      - .github/workflows/1875-bootstrap-area-labels.yml

permissions:
  contents: read
  issues: write

jobs:
  create-and-verify:
    if: github.repository == 'carlers/mosaic-life-tracker' && github.ref == 'refs/heads/chatgpt/1875-area-label-bootstrap-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create four missing exact area labels without modifying existing labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/labels?per_page=100" --jq '.[].name')"
          while IFS='|' read -r name color description; do
            if printf '%s\n' "$names" | grep -Fixq "$name"; then
              echo "PRESERVED $name"
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/labels" \
                -f name="$name" -f color="$color" -f description="$description" >/dev/null
              echo "CREATED $name"
            fi
          done <<'LABELS'
          area:integrations|1d76db|Integrations, external services, and API compatibility
          area:everyday|0e8a16|Diary, calendar, tasks, and everyday experience
          area:oracle-dr|5319e7|Oracle infrastructure, recovery, and disaster readiness
          area:release-1.0|d93f0b|Security, compatibility, and release readiness for 1.0
          LABELS
          names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/labels?per_page=100" --jq '.[].name')"
          for required in area:integrations area:everyday area:oracle-dr area:release-1.0; do
            printf '%s\n' "$names" | grep -Fixq "$required" || {
              echo "::error::Missing expected repository label $required"
              exit 1
            }
            echo "VERIFIED $required"
          done
      - name: Verify the existing routing secret has scoped private Projects access
        shell: bash
        env:
          PROJECT_TOKEN: ${{ secrets.MOSAIC_PROJECTS_ROUTING_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PROJECT_TOKEN" ]]; then
            echo "::warning::MOSAIC_PROJECTS_ROUTING_TOKEN not configured; intake cannot be activated"
            exit 0
          fi
          query='query($id: ID!) { viewer { login } node(id: $id) { ... on ProjectV2 { id public closed owner { ... on User { login } } } } }'
          for project in PVT_kwHOCQsqas4Bqt23 PVT_kwHOCQsqas4Bqxbl PVT_kwHOCQsqas4BqxxV PVT_kwHOCQsqas4BqxxX; do
            response="$(GH_TOKEN="$PROJECT_TOKEN" gh api graphql -f query="$query" -f id="$project")"
            if ! jq -e --arg project "$project" \
              '(.data.viewer.login == "carlers") and (.data.node.id == $project) and (.data.node.owner.login == "carlers") and (.data.node.public == false) and (.data.node.closed == false) and ((.errors // []) | length == 0)' \
              >/dev/null <<< "$response"; then
              echo "::error::Routing credential lacks validated private Project access"
              exit 1
            fi
          done
          echo "PROJECT_ROUTING_TOKEN_PROJECT_READBACK=VERIFIED_4_PRIVATE_PROJECTS"
