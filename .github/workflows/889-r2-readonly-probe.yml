name: Issue 889 R2 read-only recovery metadata probe
on:
  push:
    branches:
      - chatgpt/889-r2-readonly-probe-20261015
    paths:
      - .github/workflows/889-r2-readonly-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      R2_ACCOUNT_ID: ${{ secrets.DR_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.DR_R2_RECOVERY_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.DR_R2_RECOVERY_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.DR_R2_BUCKET }}
      DR_PREFIX: mosaic-dr/v1
      DR_MAX_AGE_HOURS: '36'
    steps:
      - name: Checkout exact repository source without persisted git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm independent R2 recovery read credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Repository recovery credentials are incomplete: missing $key"
              exit 1
            fi
          done
          echo "Independent repository R2 recovery-read credential variables are present."
      - name: Verify newest committed marker and ciphertext manifest HEAD (read-only)
        working-directory: life-tracker
        run: node scripts/dr-watch.mjs
