name: Issue 2298 exact-source manual collision/visual performance (noncanonical)
on:
  push:
    branches: [chatgpt/2298-final-shape-perf-20261125]
    paths: ['.github/workflows/issue-2298-live-shape-perf.yml']
permissions: { contents: read }
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    defaults:
      run: { working-directory: life-tracker }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'c4fbd4241d028a1ba65e76e8b68dbb15cc6521d4'
          persist-credentials: false
      - name: Verify exact candidate source
        run: |
          test "$(git rev-parse HEAD)" = 'c4fbd4241d028a1ba65e76e8b68dbb15cc6521d4'
          echo 'MOSAIC_2298_PERF_TARGET_SHA=c4fbd4241d028a1ba65e76e8b68dbb15cc6521d4'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run version:check
      - run: npx tsc -b --pretty false
      - run: npm run test:browser:prepare
      - run: tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Start synthetic-only local origin
        env: { VITE_POSTHOG_TOKEN: browser-contract-token, VITE_POSTHOG_HOST: https://posthog.test }
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/mosaic-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl -kfsS https://127.0.0.1:4173/tests/e2e/interaction-contract.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mosaic-vite.log
          exit 1
      - name: Compare baseline vs scoped vs final shape-synced manual overlay
        env: { MOSAIC_E2E_BASE_URL: https://127.0.0.1:4173 }
        run: tests/e2e/node_modules/.bin/playwright test tests/e2e/2298-dnd-style-plugin-trace.spec.mjs --config=playwright.config.mjs --reporter=line --grep 'dense synthetic layout trace (baseline|scoped|manual-overlay)$'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-2298-final-shape-synthetic-trace
          path: life-tracker/test-results/**/summary.json
          if-no-files-found: warn
          retention-days: 7
