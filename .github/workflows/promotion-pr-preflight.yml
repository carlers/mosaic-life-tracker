name: Promotion PR Preflight

# Cheap PR-time evidence only. Never deploy, promote, or replace the post-merge gate.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: promotion-pr-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion_preflight:
    name: promotion-pr-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: life-tracker
    steps:
      # Explicit base SHA: never execute scripts from the proposed PR branch.
      - name: Check out trusted base scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: life-tracker/scripts
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate exact PR integration evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-promotion-pr.mjs
