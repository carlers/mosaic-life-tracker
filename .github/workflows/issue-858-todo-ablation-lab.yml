name: Issue 858 Todo Reorder Mount Ablation Lab

# Diagnostic-only synthetic data. Does not run on dev/main or release PRs.
on:
  push:
    branches:
      - chatgpt/858-offline-online-pwa-20261017

permissions:
  contents: read

jobs:
  todo-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: life-tracker
    env:
      VERCEL_ENV: preview
      VITE_APPWRITE_PROJECT_ID: 6a96e82d000d1310b3be
      VITE_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      VITE_APPWRITE_MESSAGE_ACTION_FUNCTION_ID: 6aa8057f002a4c306fdd
      MOSAIC_AUDIT_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm install --prefix tests/e2e --package-lock=false --no-audit --no-fund
      - run: tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Apply isolated diagnostic hooks (never deployed)
        run: node scripts/issue-858-ablate.mjs
      # Ephemeral source instrumentation intentionally grows the synthetic test bundle.
      # Verify TypeScript, PWA completeness and fingerprint, but not shipped size ceilings.
      # This artifact is NEVER published or promoted to Preview/Production.
      - run: npx tsc -b && npx vite build && node scripts/complete-precache-sizes.mjs && node scripts/check-service-worker.mjs && node scripts/check-build-asset-fingerprint.mjs
      - name: Attribute Todo mount cost to drag-drop versus Motion
        run: tests/e2e/node_modules/.bin/playwright test tests/e2e/startup-todo-ablation.spec.mjs --config=playwright.mobile-audit.config.mjs --reporter=line
      - name: Archive raw measurements, including partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-858-todo-ablation
          path: |
            life-tracker/.mosaic/slow-startup/todo-ablation*.json
            life-tracker/test-results/**
          if-no-files-found: warn
          retention-days: 14
