name: Release 2067 Authenticated Oracle Scratch Security
on:
  push:
    branches:
      - chatgpt/2067-scratch-security-20261116
permissions: {}
concurrency:
  group: release-2067-scratch-security
  cancel-in-progress: false
jobs:
  authenticated-scratch:
    if: github.repository == 'carlers/mosaic-life-tracker' && github.actor == 'carlers' && contains(github.event.head_commit.message, '[release-security:2067]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned private-free source without retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify executable test source and target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = carlers/mosaic-life-tracker
          test "$GITHUB_REF" = refs/heads/chatgpt/2067-scratch-security-20261116
          test "$GITHUB_ACTOR" = carlers
          python3 -m py_compile life-tracker/scripts/release-2067-scratch-security.py
      - name: Execute live disposable Scratch MFA and two-owner file security probes
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 life-tracker/scripts/release-2067-scratch-security.py
