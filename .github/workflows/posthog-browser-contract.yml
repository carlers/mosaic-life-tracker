name: PostHog Browser Contract

on:
  push:
    branches:
      - 'chatgpt/**'
    paths:
      - 'life-tracker/src/lib/posthog.ts'
      - 'life-tracker/src/main.tsx'
      - 'life-tracker/tests/e2e/posthog-browser.spec.mjs'
      - '.github/workflows/posthog-browser-contract.yml'
  pull_request:
    paths:
      - 'life-tracker/src/lib/posthog.ts'
      - 'life-tracker/src/main.tsx'
      - 'life-tracker/tests/e2e/posthog-browser.spec.mjs'
      - '.github/workflows/posthog-browser-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posthog-browser-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: life-tracker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.58.2

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Mosaic
        env:
          VITE_POSTHOG_TOKEN: phc_e2e
          VITE_POSTHOG_HOST: https://posthog.test
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/mosaic-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl -kfsS https://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mosaic-vite.log
          exit 1

      - name: Run PostHog browser contract
        env:
          MOSAIC_E2E_BASE_URL: https://127.0.0.1:4173
        run: npx playwright test tests/e2e/posthog-browser.spec.mjs --reporter=line
