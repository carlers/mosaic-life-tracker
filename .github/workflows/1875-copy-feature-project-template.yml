name: One-time — copy verified safe Project configuration

on:
  push:
    branches:
      - chatgpt/1875-copy-feature-project-template-20261110
    paths:
      - .github/workflows/1875-copy-feature-project-template.yml

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Copy the verified private feature Project template
        env:
          GITHUB_TOKEN: ${{ secrets.MOSAIC_PROJECTS_ROUTING_TOKEN }}
        run: |
          node <<'NODE'
          const endpoint = 'https://api.github.com/graphql';
          const headers = {
            authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
            accept: 'application/vnd.github+json',
            'content-type': 'application/json',
            'user-agent': 'mosaic-project-template-copy'
          };
          async function gql(query, variables = {}) {
            if (!process.env.GITHUB_TOKEN) throw Error('Project-scoped token unavailable');
            const response = await fetch(endpoint, {
              method: 'POST', headers, body: JSON.stringify({query, variables})
            });
            const body = await response.json();
            if (!response.ok || body.errors?.length || !body.data) {
              throw Error('GitHub GraphQL request failed: ' +
                (body.errors || [{message: 'HTTP ' + response.status}]).map(x => x.message).join('; '));
            }
            return body.data;
          }
          const ownerLogin = 'carlers';
          const templateNumber = 1;
          const desired = [
            'Mosaic — Social Experience',
            'Mosaic — Storage & Media Lifecycle',
            'Mosaic — Product Discovery & Support',
            'Mosaic — Platform & Engineering'
          ];
          const query = `query($login:String!,$number:Int!){
            viewer{login}
            user(login:$login){
              id
              projectsV2(first:100){nodes{id title number public closed}}
              projectV2(number:$number){
                id title number public closed
                items(first:1){totalCount}
                fields(first:100){
                  pageInfo{hasNextPage}
                  nodes{
                    __typename
                    ... on ProjectV2Field{id name dataType}
                    ... on ProjectV2SingleSelectField{id name options{id name color description}}
                  }
                }
                workflows(first:50){pageInfo{hasNextPage} nodes{id name enabled}}
              }
            }
          }`;
          const initial = await gql(query, {login: ownerLogin, number: templateNumber});
          if (initial.viewer?.login !== ownerLogin) throw Error('Wrong authenticated GitHub account');
          const user = initial.user;
          const source = user?.projectV2;
          if (!user?.id || !source || source.title !== 'Mosaic — Integrations & Plugins' ||
              source.public !== false || source.closed !== false ||
              source.fields?.pageInfo?.hasNextPage || source.workflows?.pageInfo?.hasNextPage) {
            throw Error('Source Project identity, privacy or snapshot bounds failed');
          }
          const unsafe = ['Auto-close issue','Item closed','Pull request merged'];
          for (const name of unsafe) {
            const workflow = source.workflows.nodes.find(x => x.name === name);
            if (!workflow || workflow.enabled !== false) {
              throw Error('Template safety precondition failed: ' + name + ' must exist and be disabled');
            }
          }
          const expectedFields = {
            'Status':['Backlog','Planned','Approved','In Progress','Verification','Done'],
            'Work type':['Feature','Bug','Research','Infrastructure','Documentation'],
            'Delivery stage':['Not started','Task branch','Preview','Dev','Production','N/A'],
            'Blocked':['No','Yes']
          };
          for (const [name, options] of Object.entries(expectedFields)) {
            const field = source.fields.nodes.find(x => x.name === name);
            if (!field || field.__typename !== 'ProjectV2SingleSelectField' ||
                JSON.stringify(field.options.map(x => x.name)) !== JSON.stringify(options)) {
              throw Error('Template field mismatch: ' + name);
            }
          }
          const existing = user.projectsV2.nodes;
          const copyMutation = `mutation($project:ID!,$owner:ID!,$title:String!){
            copyProjectV2(input:{
              projectId:$project,ownerId:$owner,title:$title,includeDraftIssues:false
            }){projectV2{id number title public closed}}
          }`;
          const verifyQuery = `query($id:ID!){
            node(id:$id){
              ... on ProjectV2{
                id number title public closed
                items(first:1){totalCount}
                workflows(first:50){pageInfo{hasNextPage} nodes{name enabled}}
                fields(first:100){
                  pageInfo{hasNextPage}
                  nodes{
                    __typename
                    ... on ProjectV2Field{id name dataType}
                    ... on ProjectV2SingleSelectField{id name options{id name}}
                  }
                }
              }
            }
          }`;
          const created = [];
          for (const title of desired) {
            const match = existing.find(x => x.title === title);
            if (match) {
              if (match.public !== false || match.closed !== false) {
                throw Error('Existing destination is not an open private Project: ' + title);
              }
              throw Error('Destination already exists; manual reconciliation required: ' + title);
            }
            const result = await gql(copyMutation, {
              project: source.id, owner: user.id, title
            });
            const project = result.copyProjectV2?.projectV2;
            if (!project?.id || project.title !== title || project.public !== false || project.closed !== false) {
              throw Error('Copy did not return the expected private Project: ' + title);
            }
            const verified = (await gql(verifyQuery, {id: project.id})).node;
            if (!verified || verified.title !== title || verified.public !== false ||
                verified.closed !== false || verified.items?.totalCount !== 0 ||
                verified.workflows?.pageInfo?.hasNextPage || verified.fields?.pageInfo?.hasNextPage) {
              throw Error('Copied Project readback failed: ' + title);
            }
            for (const name of unsafe) {
              const workflow = verified.workflows.nodes.find(x => x.name === name);
              if (!workflow || workflow.enabled !== false) {
                throw Error('Copied Project unsafe workflow enabled or missing: ' + title + ' / ' + name);
              }
            }
            for (const [name, options] of Object.entries(expectedFields)) {
              const field = verified.fields.nodes.find(x => x.name === name);
              if (!field || field.__typename !== 'ProjectV2SingleSelectField' ||
                  JSON.stringify(field.options.map(x => x.name)) !== JSON.stringify(options)) {
                throw Error('Copied field readback failed: ' + title + ' / ' + name);
              }
            }
            created.push({title, number:verified.number, id:verified.id,
              workflows:verified.workflows.nodes.map(x => ({name:x.name,enabled:x.enabled}))});
            await new Promise(resolve => setTimeout(resolve, 700));
          }
          console.log(JSON.stringify({template:{number:source.number,title:source.title,public:source.public},
            copied:created}, null, 2));
          NODE
