name: Interaction Browser Contract

on:
  push:
    branches:
      - preview
      - 'chatgpt/**'
    paths:
      - 'life-tracker/src/components/ui/BottomSheet.tsx'
      - 'life-tracker/src/components/home/views/CalendarCarousel.tsx'
      - 'life-tracker/src/components/home/views/DayCell.tsx'
      - 'life-tracker/src/components/home/views/MonthView.tsx'
      - 'life-tracker/src/components/home/views/WeekView.tsx'
      - 'life-tracker/src/components/home/views/DayViewSheet.tsx'
      - 'life-tracker/src/components/home/views/DayCell.tsx'
      - 'life-tracker/src/components/home/views/MonthView.tsx'
      - 'life-tracker/src/components/home/views/WeekView.tsx'
      - 'life-tracker/src/components/home/views/DayViewSheet.tsx'
      - 'life-tracker/src/components/home/views/TodoListView.tsx'
      - 'life-tracker/src/pages/HomePage.tsx'
      - 'life-tracker/src/hooks/useHorizontalArrowNavigation.ts'
      - 'life-tracker/tests/e2e/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    paths:
      - 'life-tracker/src/components/ui/BottomSheet.tsx'
      - 'life-tracker/src/components/home/views/CalendarCarousel.tsx'
      - 'life-tracker/src/components/home/views/DayViewSheet.tsx'
      - 'life-tracker/src/components/home/views/TodoListView.tsx'
      - 'life-tracker/src/pages/HomePage.tsx'
      - 'life-tracker/src/hooks/useHorizontalArrowNavigation.ts'
      - 'life-tracker/tests/e2e/**'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interaction-browser-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: life-tracker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned browser test dependencies
        run: npm install --no-save --package-lock=false @playwright/test@1.58.2 @axe-core/playwright@4.10.2

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Mosaic
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/mosaic-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl -kfsS https://127.0.0.1:4173/tests/e2e/interaction-contract.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mosaic-vite.log
          exit 1

      - name: Run interaction browser contracts
        env:
          MOSAIC_E2E_BASE_URL: https://127.0.0.1:4173
        run: npx playwright test tests/e2e/bottom-sheet-history.spec.mjs tests/e2e/interaction-contract.spec.mjs --reporter=line
