# Default-main-owned reader of completed official Dev delivery; never executes Dev branch code.
name: Publish Verified Development History

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
  workflow_run:
    workflows: [Quality Gate, Dev Stable PWA Alias Delivery]
    types: [completed]
    branches:
      - dev
      - 'feature/**'
      - 'fix/**'
      - 'perf/**'
      - 'security/**'
      - 'refactor/**'

permissions:
  contents: read
  checks: read

jobs:
  record_dev_history:
    name: Record Dev version after stable PWA alias delivery
    if: >-
      ${{ github.repository == 'carlers/mosaic-life-tracker' &&
        github.ref == 'refs/heads/main' &&
        vars.MOSAIC_RELEASE_HISTORY_PUBLISH_ENABLED == 'true' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.name == 'Dev Stable PWA Alias Delivery' &&
        github.event.workflow_run.head_branch == 'dev' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    concurrency:
      group: mosaic-development-history-writer
      cancel-in-progress: false
    steps:
      - name: Check out current trusted Main publisher, not Dev source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Publish only after Dev alias and canonical CI readback
        working-directory: life-tracker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.MOSAIC_PREVIEW_AUTO_VERCEL_TOKEN }}
          HISTORY_STAGE: dev
          HISTORY_SHA: ${{ github.event.workflow_run.head_sha }}
          HISTORY_BRANCH: dev
        run: node scripts/publish-development-history.mjs

  record_preview_history:
    name: Record exact READY stable Preview version
    if: >-
      ${{ github.repository == 'carlers/mosaic-life-tracker' &&
        github.ref == 'refs/heads/main' &&
        vars.MOSAIC_RELEASE_HISTORY_PUBLISH_ENABLED == 'true' &&
        github.event.workflow_run.name == 'Quality Gate' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        (startsWith(github.event.workflow_run.head_branch, 'feature/') ||
         startsWith(github.event.workflow_run.head_branch, 'fix/') ||
         startsWith(github.event.workflow_run.head_branch, 'perf/') ||
         startsWith(github.event.workflow_run.head_branch, 'security/') ||
         startsWith(github.event.workflow_run.head_branch, 'refactor/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      checks: read
    concurrency:
      group: mosaic-development-history-writer
      cancel-in-progress: false
    steps:
      - name: Check out trusted Main history publisher, never Preview source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify exact canonical CI, wait for READY Preview and record history
        working-directory: life-tracker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.MOSAIC_PREVIEW_AUTO_VERCEL_TOKEN }}
          HISTORY_STAGE: preview
          HISTORY_SHA: ${{ github.event.workflow_run.head_sha }}
          HISTORY_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: node scripts/publish-development-history.mjs

  reconcile_dev_history:
    name: Reconcile current verified Dev history
    if: >-
      ${{ github.repository == 'carlers/mosaic-life-tracker' &&
        github.ref == 'refs/heads/main' &&
        vars.MOSAIC_RELEASE_HISTORY_PUBLISH_ENABLED == 'true' &&
        (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    concurrency:
      group: mosaic-development-history-writer
      cancel-in-progress: false
    steps:
      - name: Check out trusted Main publisher for guarded current-Dev reconciliation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify live Dev canonical CI and stable alias before recording
        working-directory: life-tracker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.MOSAIC_PREVIEW_AUTO_VERCEL_TOKEN }}
          HISTORY_STAGE: dev
          HISTORY_BRANCH: dev
        run: node scripts/publish-development-history.mjs
