name: Project Issue Intake Tests

on:
  push:
    paths:
      - 'life-tracker/scripts/project-intake/**'
      - '.github/workflows/issue-project-intake.yml'
      - '.github/workflows/issue-project-intake-ci.yml'
  pull_request:
    paths:
      - 'life-tracker/scripts/project-intake/**'
      - '.github/workflows/issue-project-intake.yml'
      - '.github/workflows/issue-project-intake-ci.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test life-tracker/scripts/project-intake/*.test.mjs
