name: Supabase Scratch Private Media Offsite Watch

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch-encrypted-media:
    if: ${{ github.ref == 'refs/heads/main' && vars.SUPABASE_MEDIA_DR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mosaic-supabase-media-dr
    defaults:
      run:
        working-directory: life-tracker
    env:
      MEDIA_DR_ENABLED: 'true'
      MEDIA_DR_SOURCE_PROJECT: mosaic-dev
      MEDIA_DR_R2_ACCOUNT_ID: ${{ secrets.SUPABASE_MEDIA_DR_R2_ACCOUNT_ID }}
      MEDIA_DR_R2_ACCESS_KEY_ID: ${{ secrets.SUPABASE_MEDIA_DR_R2_READ_ACCESS_KEY_ID }}
      MEDIA_DR_R2_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_MEDIA_DR_R2_READ_SECRET_ACCESS_KEY }}
      MEDIA_DR_R2_BUCKET: ${{ vars.SUPABASE_MEDIA_DR_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authenticate every ciphertext byte and check latest completed snapshot age
        run: node supabase-poc/private-media-offsite.mjs --watch
