name: Verify

on:
  push:
    branches:
      - preview
      - 'chatgpt/**'
    paths:
      - 'life-tracker/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'life-tracker/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      browser: ${{ steps.classify.outputs.browser }}
      base: ${{ steps.classify.outputs.base }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github
            life-tracker
      - name: Classify verification mode
        id: classify
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node life-tracker/scripts/ci-classify.mjs

  preview_verified:
    name: preview-verified
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require prior canonical acceptance for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          count="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$REPO/commits/$SHA/check-runs?filter=all&per_page=100" \
              --jq '[.check_runs[] | select(.name == "canonical-acceptance" and .conclusion == "success")] | length'
          )"
          if [ "$count" -lt 1 ]; then
            echo "Preview SHA $SHA has no successful canonical-acceptance check."
            exit 1
          fi
          echo "Preview SHA $SHA already passed canonical acceptance; duplicate full verification skipped."

  docs_checks:
    name: docs-checks
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github
            life-tracker
      - name: Ensure diff base is available
        env:
          BASE: ${{ needs.classify.outputs.base }}
        run: |
          if ! git -C .. cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git -C .. fetch --no-tags --depth=1 origin "$BASE"
          fi
      - name: Check project contracts
        run: npm run contracts:check
      - name: Check documentation diff
        env:
          BASE: ${{ needs.classify.outputs.base }}
        run: git -C .. diff --check "$BASE" HEAD

  focused_checks:
    name: focused-checks
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'focused' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github
            life-tracker
      - name: Ensure diff base is available
        env:
          BASE: ${{ needs.classify.outputs.base }}
        run: |
          if ! git -C .. cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git -C .. fetch --no-tags --depth=1 origin "$BASE"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - name: Cache focused task dependencies
        id: focused-node-modules-cache
        uses: actions/cache@v4
        with:
          path: life-tracker/node_modules
          key: ${{ runner.os }}-node22-focused-modules-${{ hashFiles('life-tracker/package-lock.json') }}
      - name: Install dependencies on cache miss
        if: steps.focused-node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit
      - name: Verify focused change set
        env:
          BASE: ${{ needs.classify.outputs.base }}
        run: node scripts/verify-focused.mjs "$BASE"

  static_checks:
    name: static-checks
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github
            life-tracker
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Check project contracts
        run: npm run contracts:check
      - name: Check test discovery
        run: npm run test:discovery
      - name: Lint
        run: npm run lint

  unit_tests:
    name: unit-tests
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github
            life-tracker
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Run unit tests
        run: npm run test:unit

  handler_tests:
    name: handler-tests
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: life-tracker
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Run handler tests
        run: npm run test:handlers

  dom_tests:
    name: dom-tests
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: life-tracker
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Run DOM tests
        run: npm run test:dom

  build_check:
    name: build
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: life-tracker
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Build production app
        run: npm run build

  browser_contract:
    name: browser-contract
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'full' || needs.classify.outputs.browser == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: life-tracker
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - name: Cache prepared browser test dependencies
        id: browser-node-modules-cache
        uses: actions/cache@v4
        with:
          path: life-tracker/node_modules
          key: ${{ runner.os }}-node22-browser-modules-${{ hashFiles('life-tracker/package-lock.json') }}-pw1.58.2-axe4.10.2
      - name: Prepare pinned browser-test dependencies on cache miss
        if: steps.browser-node-modules-cache.outputs.cache-hit != 'true'
        run: |
          npm ci --prefer-offline --no-audit
          npm install --no-save --package-lock=false --no-audit @playwright/test@1.58.2 @axe-core/playwright@4.10.2
      - name: Cache Playwright Chromium
        id: playwright-browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.58.2
      - name: Install Chromium on cache miss
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start local Mosaic
        env:
          VITE_POSTHOG_TOKEN: browser-contract-token
          VITE_POSTHOG_HOST: https://posthog.test
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/mosaic-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl -kfsS https://127.0.0.1:4173/tests/e2e/interaction-contract.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mosaic-vite.log
          exit 1
      - name: Run repository browser contracts
        env:
          MOSAIC_E2E_BASE_URL: https://127.0.0.1:4173
        run: npm run test:browser-contract

  canonical_acceptance:
    name: canonical-acceptance
    needs:
      - classify
      - static_checks
      - unit_tests
      - handler_tests
      - dom_tests
      - build_check
      - browser_contract
    if: ${{ always() && needs.classify.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm every canonical gate passed
        env:
          STATIC_RESULT: ${{ needs.static_checks.result }}
          UNIT_RESULT: ${{ needs.unit_tests.result }}
          HANDLER_RESULT: ${{ needs.handler_tests.result }}
          DOM_RESULT: ${{ needs.dom_tests.result }}
          BUILD_RESULT: ${{ needs.build_check.result }}
          BROWSER_RESULT: ${{ needs.browser_contract.result }}
        run: |
          failed=0
          for result in "$STATIC_RESULT" "$UNIT_RESULT" "$HANDLER_RESULT" "$DOM_RESULT" "$BUILD_RESULT" "$BROWSER_RESULT"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Canonical acceptance failed because at least one required parallel gate did not succeed."
            exit 1
          fi
          echo "Canonical acceptance passed for exact SHA ${{ github.sha }}."
