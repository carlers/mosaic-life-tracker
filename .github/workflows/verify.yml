name: Verify

on:
  push:
    branches:
      - preview
      - 'chatgpt/**'
    paths:
      - 'life-tracker/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'life-tracker/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: life-tracker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify repository gate
        run: npm run verify

      - name: One-time repository hygiene cleanup
        if: github.ref == 'refs/heads/chatgpt/todo-tdd-test-audit'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          stale_branches=(
            chatgpt/appwrite-live-rollout
            chatgpt/appwrite-shared-maintenance
            chatgpt/fix-todo-layout-swipe-ci
            chatgpt/native-back-keyboard-nav
            chatgpt/native-back-stack-v2
            chatgpt/phase4-calendar-semantics
            chatgpt/phase-3-7-posthog
            chatgpt/playwright-interaction-contract
            chatgpt/todo-dayview-parity
            codex/find-project-workflow-explanation
            codex/follow-documentation-steps
          )

          for branch in "${stale_branches[@]}"; do
            git push origin --delete "$branch" || true
          done

          retired_workflows=(363395644 363175235 363076037)
          for workflow_id in "${retired_workflows[@]}"; do
            run_ids="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?per_page=100" \
              | jq -r '.workflow_runs[].id')"
            for run_id in $run_ids; do
              curl -fsSL -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
            done
          done

  browser-contract:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: life-tracker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned browser-test dependencies
        run: npm install --no-save --package-lock=false @playwright/test@1.58.2 @axe-core/playwright@4.10.2

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Mosaic
        env:
          VITE_POSTHOG_TOKEN: browser-contract-token
          VITE_POSTHOG_HOST: https://posthog.test
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/mosaic-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl -kfsS https://127.0.0.1:4173/tests/e2e/interaction-contract.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mosaic-vite.log
          exit 1

      - name: Run repository browser contracts
        env:
          MOSAIC_E2E_BASE_URL: https://127.0.0.1:4173
        run: npm run test:browser-contract
