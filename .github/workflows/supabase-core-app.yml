name: Supabase Core App Lab
on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/1027-supabase-core-app-*'
      - 'refactor/1027-supabase-core-app-*'
      - 'codex/1027-supabase-hosted-*'
      - 'refactor/1027-supabase-hosted-*'
      - 'codex/1027-supabase-recovery-*'
      - 'feature/1027-supabase-recovery-*'
permissions:
  contents: read
concurrency:
  group: supabase-core-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Install app and browser dependencies
        run: |
          npm ci --prefer-offline --no-audit
          npm run test:browser:prepare
          tests/e2e/node_modules/.bin/playwright install chromium
      - name: Configure disposable Supabase with core authority
        run: |
          supabase init --yes
          mkdir -p supabase/migrations
          cp supabase-poc/migrations/20261018_candidate_task_category_owner_schema.sql supabase/migrations/20261018000000_schema.sql
          cp supabase-poc/migrations/20261018_candidate_revoke_default_delete.sql supabase/migrations/20261018000001_privileges.sql
          cp supabase-poc/migrations/20261019_candidate_atomic_cas_rpc.sql supabase/migrations/20261019000000_cas.sql
          cp supabase-poc/migrations/20261020_candidate_task_protected_fields.sql supabase/migrations/20261020000000_protected.sql
          cp supabase-poc/migrations/20261020_core_fresh_identity_authority.sql supabase/migrations/20261020000001_authority.sql
          # Install staged hook SQL in LOCAL disposable Postgres only, not in mosaic-dev.
          cp supabase-poc/migrations/20261021_beta_signup_invite_gate.sql supabase/migrations/20261021000000_beta_invite.sql
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('supabase/config.toml')
          text = p.read_text()
          pattern = r'(?m)^enable_confirmations\s*=\s*(true|false)\s*$'
          if not re.search(pattern, text):
              raise SystemExit('Missing local confirmation configuration')
          text = re.sub(pattern, 'enable_confirmations = false', text)
          expiry = r'(?m)^jwt_expiry\s*=\s*\d+\s*$'
          if not re.search(expiry, text):
              raise SystemExit('Missing local JWT expiry configuration')
          p.write_text(re.sub(expiry, 'jwt_expiry = 60', text))
          PY
          supabase start --exclude realtime,storage,functions,studio,mail,analytics,pooler
          supabase db reset --local
      - name: Verify staged invite admission against disposable PostgreSQL
        run: |
          set -euo pipefail
          # GoTrue hook remains DISABLED so synthetic admin fixtures still work.
          mapfile -t db_containers < <(docker ps --filter name=supabase_db_ --format '{{.Names}}')
          if [[ "${#db_containers[@]}" -ne 1 ]]; then
            echo "Expected one disposable Supabase database container" >&2; exit 1
          fi
          docker exec -i "${db_containers[0]}" psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            < supabase-poc/validation/20261021_beta_signup_invite_probe.sql \
            > "$RUNNER_TEMP/mosaic-beta-invite-probe.log"
          grep -qx 'ROLLBACK' "$RUNNER_TEMP/mosaic-beta-invite-probe.log"
      - name: Exercise signed real UI and server authority
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/mosaic-core-local.env"
          set -a
          source "$RUNNER_TEMP/mosaic-core-local.env"
          set +a
          : "${PUBLISHABLE_KEY:?Local publishable key required}"
          export VITE_MOSAIC_BACKEND=supabase-cloud
          export VITE_MOSAIC_FEATURE_PROFILE=core-only
          export VITE_SUPABASE_URL=http://127.0.0.1:54321
          export VITE_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export MOSAIC_SB_LOCAL_URL="$VITE_SUPABASE_URL"
          export MOSAIC_SB_LOCAL_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export MOSAIC_CORE_APP_LAB=true
          export MOSAIC_CORE_SHORT_JWT=true
          npm run build
          # Service workers reject the development self-signed certificate even
          # when a page accepts it. Loopback HTTP is a browser secure context.
          # Serve the already validated build without the dev-only SSL plugin.
          printf '%s\n' 'export default {};' > "$RUNNER_TEMP/mosaic-core-http.config.mjs"
          export MOSAIC_E2E_BASE_URL=http://127.0.0.1:4173
          npm run preview -- --config "$RUNNER_TEMP/mosaic-core-http.config.mjs" --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/mosaic-core-vite.log" 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS "$MOSAIC_E2E_BASE_URL/" >/dev/null; then break; fi
            sleep 1
          done
          tests/e2e/node_modules/.bin/playwright test tests/e2e/supabase-core-app.spec.mjs --workers=1 --reporter=line,github
      - name: Destroy disposable data
        if: always()
        run: supabase stop --no-backup || true
  hosted-preview-artifact:
    needs: core-app
    if: startsWith(github.ref, 'refs/heads/codex/1027-supabase-recovery-') || startsWith(github.ref, 'refs/heads/feature/1027-supabase-recovery-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Build isolated mosaic-dev bytes with public inputs only
        run: node scripts/build-supabase-core-preview.mjs
      # Run the real ZIP-to-prebuilt stage from exact disposable CI bytes.
      # No Vercel/API secrets, rebuild, provider writes, or alias operations.
      # This runner-local digest tests staging behavior, NOT signed GitHub
      # artifact provenance; the trusted external operator checks that later.
      - name: Stage and reject tampering of isolated Supabase CI artifact
        run: |
          set -euo pipefail
          source_dir=".mosaic/supabase-core-preview"
          stage_zip="$RUNNER_TEMP/mosaic-stage-test.zip"
          zip -q -X -j "$stage_zip" "$source_dir/config.json" "$source_dir/dist.tar.gz" "$source_dir/dist.tar.gz.sha256" "$source_dir/evidence.json" "$source_dir/inventory.json" "$source_dir/routing-evidence.json"
          zip_sha="$(sha256sum "$stage_zip" | cut -d' ' -f1)"
          staged="$RUNNER_TEMP/mosaic-supabase-staged"
          node scripts/stage-supabase-core-artifact.mjs "$stage_zip" "$GITHUB_SHA" "$zip_sha" "$staged"
          test -s "$staged/.vercel/output/config.json"
          test -s "$staged/.vercel/output/static/index.html"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const x = JSON.parse(readFileSync(process.argv[1] + "/.mosaic-staged-evidence.json"));
            if (x.status !== "STAGED_NOT_DEPLOYED" || x.deploymentAuthorized !== false ||
                x.acceptedSha !== process.env.GITHUB_SHA || x.files < 1 ||
                x.target !== "preview" || x.backend !== "supabase-cloud") process.exit(1);
          ' "$staged"
          if node scripts/stage-supabase-core-artifact.mjs "$stage_zip" "$GITHUB_SHA" "$(printf '%064d' 0)" "$RUNNER_TEMP/tampered-stage"; then
            echo "Tampered ZIP digest accepted" >&2; exit 1
          fi
          if node scripts/stage-supabase-core-artifact.mjs "$stage_zip" "$GITHUB_SHA" "$zip_sha" "$staged"; then
            echo "Existing stage destination overwritten" >&2; exit 1
          fi
      # This is deliberately a different artifact from the Appwrite receiver's.
      # Exact source canonical acceptance and lab success are required before
      # a separately authorized operator deploys these verified static bytes.
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-supabase-core-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: life-tracker/.mosaic/supabase-core-preview/*
          if-no-files-found: error
          retention-days: 7
