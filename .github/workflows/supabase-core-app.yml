name: Supabase Core App Lab
on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/1027-supabase-core-app-*'
      - 'refactor/1027-supabase-core-app-*'
      - 'codex/1027-supabase-hosted-*'
      - 'refactor/1027-supabase-hosted-*'
      - 'codex/1027-supabase-recovery-*'
      - 'feature/1027-supabase-recovery-*'
permissions:
  contents: read
concurrency:
  group: supabase-core-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Install app and browser dependencies
        run: |
          npm ci --prefer-offline --no-audit
          npm run test:browser:prepare
          tests/e2e/node_modules/.bin/playwright install chromium
      - name: Configure disposable Supabase with core authority
        run: |
          supabase init --yes
          mkdir -p supabase/migrations
          cp supabase-poc/migrations/20261018_candidate_task_category_owner_schema.sql supabase/migrations/20261018000000_schema.sql
          cp supabase-poc/migrations/20261018_candidate_revoke_default_delete.sql supabase/migrations/20261018000001_privileges.sql
          cp supabase-poc/migrations/20261019_candidate_atomic_cas_rpc.sql supabase/migrations/20261019000000_cas.sql
          cp supabase-poc/migrations/20261020_candidate_task_protected_fields.sql supabase/migrations/20261020000000_protected.sql
          cp supabase-poc/migrations/20261020_core_fresh_identity_authority.sql supabase/migrations/20261020000001_authority.sql
          cp supabase-poc/migrations/20261021_core_realtime_publication.sql supabase/migrations/20261020000002_realtime.sql
          cp supabase-poc/migrations/20261022_candidate_private_diary_domain.sql supabase/migrations/20261020000003_private_diary.sql
          cp supabase-poc/migrations/20261022_candidate_category_retirement.sql supabase/migrations/20261020000004_retirement.sql
          cp supabase-poc/migrations/20261023_candidate_atomic_category_delete.sql supabase/migrations/20261020000006_atomic_category_delete.sql
          cp supabase-poc/migrations/20261022_candidate_private_diary_realtime.sql supabase/migrations/20261020000005_diary_realtime.sql
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('supabase/config.toml')
          text = p.read_text()
          pattern = r'(?m)^enable_confirmations\s*=\s*(true|false)\s*$'
          if not re.search(pattern, text):
              raise SystemExit('Missing local confirmation configuration')
          text = re.sub(pattern, 'enable_confirmations = false', text)
          expiry = r'(?m)^jwt_expiry\s*=\s*\d+\s*$'
          if not re.search(expiry, text):
              raise SystemExit('Missing local JWT expiry configuration')
          p.write_text(re.sub(expiry, 'jwt_expiry = 60', text))
          PY
          # Docker public image registries sometimes rate-limit ephemeral GH
          # runners (429/toomanyrequests). Retry ONLY disposable stack startup;
          # always fail closed if all attempts fail. No checks are bypassed.
          for startup_attempt in 1 2 3; do
            if supabase start --exclude realtime,storage,functions,studio,mail,analytics,pooler; then
              break
            fi
            if (( startup_attempt == 3 )); then
              echo "Disposable Supabase image pull failed after bounded retries" >&2
              exit 1
            fi
            supabase stop --no-backup || true
            sleep "$((startup_attempt * 20))"
          done
          supabase db reset --local
      - name: Validate inactive invite-only hook in disposable PostgreSQL
        run: |
          set -euo pipefail
          # Bind only to the local Supabase CLI database container.
          # Never connect to any hosted project or install GoTrue Auth hooks.
          mapfile -t local_db < <(docker ps --filter name=supabase_db_ --format '{{.ID}}')
          test "${#local_db[@]}" -eq 1
          test -n "${local_db[0]}"
          docker exec -i "${local_db[0]}" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase-poc/migrations/20261021_beta_signup_invite_gate.sql
          docker exec -i "${local_db[0]}" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase-poc/validation/20261021_beta_signup_invite_probe.sql
          # The migration is local-test-only and GoTrue hook activation remains off.
      - name: Assert private Diary schema on disposable database
        run: |
          set -euo pipefail
          mapfile -t local_db < <(docker ps --filter name=supabase_db_ --format '{{.ID}}')
          test "${#local_db[@]}" -eq 1
          docker exec -i "${local_db[0]}" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase-poc/validation/20261022_private_diary_contract.sql
          docker exec -i "${local_db[0]}" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase-poc/validation/20261022_private_diary_realtime_contract.sql
          docker exec -i "${local_db[0]}" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase-poc/validation/20261023_atomic_category_delete_contract.sql
      - name: Exercise signed real UI and server authority
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/mosaic-core-local.env"
          set -a
          source "$RUNNER_TEMP/mosaic-core-local.env"
          set +a
          : "${PUBLISHABLE_KEY:?Local publishable key required}"
          export VITE_MOSAIC_BACKEND=supabase-cloud
          export VITE_MOSAIC_FEATURE_PROFILE=core-only
          export VITE_SUPABASE_URL=http://127.0.0.1:54321
          export VITE_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export MOSAIC_SB_LOCAL_URL="$VITE_SUPABASE_URL"
          export MOSAIC_SB_LOCAL_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export MOSAIC_CORE_APP_LAB=true
          export MOSAIC_CORE_SHORT_JWT=true
          npm run build
          # Service workers reject the development self-signed certificate even
          # when a page accepts it. Loopback HTTP is a browser secure context.
          # Serve the already validated build without the dev-only SSL plugin.
          printf '%s\n' 'export default {};' > "$RUNNER_TEMP/mosaic-core-http.config.mjs"
          export MOSAIC_E2E_BASE_URL=http://127.0.0.1:4173
          npm run preview -- --config "$RUNNER_TEMP/mosaic-core-http.config.mjs" --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/mosaic-core-vite.log" 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS "$MOSAIC_E2E_BASE_URL/" >/dev/null; then break; fi
            sleep 1
          done
          tests/e2e/node_modules/.bin/playwright test tests/e2e/supabase-core-app.spec.mjs --workers=1 --reporter=line,github
      - name: Exercise signed core-diary actual UI and second-device replication
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/mosaic-core-local.env"
          : "${PUBLISHABLE_KEY:?Local publishable key required}"
          export VITE_MOSAIC_BACKEND=supabase-cloud
          export VITE_MOSAIC_FEATURE_PROFILE=core-diary
          export VITE_SUPABASE_URL=http://127.0.0.1:54321
          export VITE_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export MOSAIC_SB_LOCAL_URL="$VITE_SUPABASE_URL"
          export MOSAIC_SB_LOCAL_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export MOSAIC_CORE_APP_LAB=true
          export MOSAIC_CORE_DIARY_UI_LAB=true
          npm run build
          export MOSAIC_E2E_BASE_URL=http://127.0.0.1:4174
          npm run preview -- --config "$RUNNER_TEMP/mosaic-core-http.config.mjs" --host 127.0.0.1 --port 4174 --strictPort > "$RUNNER_TEMP/mosaic-diary-vite.log" 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS "$MOSAIC_E2E_BASE_URL/" >/dev/null; then break; fi
            sleep 1
          done
          tests/e2e/node_modules/.bin/playwright test tests/e2e/supabase-core-app.spec.mjs --grep '@diary-ui' --workers=1 --reporter=line,github
      - name: Exercise actual disposable GoTrue invite hook
        run: |
          set -euo pipefail
          # The signed core UI ran with the hook disabled. Recreate only the
          # local CLI stack with the candidate enabled for real Auth requests.
          supabase stop --no-backup
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/config.toml')
          lines = p.read_text().splitlines()
          header = '[auth.hook.before_user_created]'
          value = 'uri = "pg-functions://postgres/mosaic_candidate_private/beta_before_user_created"'
          locations = [i for i, line in enumerate(lines) if line.strip() == header]
          if len(locations) > 1:
              raise SystemExit('Duplicate local Auth hook sections')
          if not locations:
              lines.extend([header, 'enabled = true', value])
          else:
              begin = locations[0] + 1
              end = next((i for i in range(begin, len(lines))
                          if lines[i].strip().startswith('[') and lines[i].strip().endswith(']')),
                         len(lines))
              section = lines[begin:end]
              enabled = [i for i, line in enumerate(section) if line.strip() == 'enabled = false']
              if len(enabled) != 1:
                  raise SystemExit('Local hook must be disabled before acceptance setup')
              section[enabled[0]] = 'enabled = true'
              uris = [i for i, line in enumerate(section) if line.strip().startswith('uri =')]
              if len(uris) > 1:
                  raise SystemExit('Duplicate local hook URIs')
              if uris:
                  section[uris[0]] = value
              else:
                  section.append(value)
              lines[begin:end] = section
          p.write_text(chr(10).join(lines) + chr(10))
          PY
          cp supabase-poc/migrations/20261021_beta_signup_invite_gate.sql \
            supabase/migrations/20261021000000_invite_gate.sql
          # Docker public image registries sometimes rate-limit ephemeral GH
          # runners (429/toomanyrequests). Retry ONLY disposable stack startup;
          # always fail closed if all attempts fail. No checks are bypassed.
          for startup_attempt in 1 2 3; do
            if supabase start --exclude realtime,storage,functions,studio,mail,analytics,pooler; then
              break
            fi
            if (( startup_attempt == 3 )); then
              echo "Disposable Supabase image pull failed after bounded retries" >&2
              exit 1
            fi
            supabase stop --no-backup || true
            sleep "$((startup_attempt * 20))"
          done
          supabase db reset --local
          mapfile -t db_containers < <(docker ps --filter name=supabase_db_ --format '{{.ID}}')
          test "${#db_containers[@]}" -eq 1
          docker exec -i "${db_containers[0]}" psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres <<'SQL'
          insert into mosaic_candidate_private.beta_signup_invitations(email,created_at,expires_at)
          values ('mosaic-invite-allowed@example.org',now(),now()+interval '1 day'),
                 ('mosaic-invite-admin@example.org',now(),now()+interval '1 day'),
                 ('mosaic-invite-revoked@example.org',now(),now()+interval '1 day'),
                 ('mosaic-invite-expired@example.org',now()-interval '2 days',now()-interval '1 day');
          update mosaic_candidate_private.beta_signup_invitations
            set revoked_at=now() where email='mosaic-invite-revoked@example.org';
          SQL
          supabase status -o env > "$RUNNER_TEMP/mosaic-invite-local.env"
          set -a
          source "$RUNNER_TEMP/mosaic-invite-local.env"
          set +a
          export MOSAIC_SB_LOCAL_URL=http://127.0.0.1:54321
          export MOSAIC_SB_LOCAL_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:?Required local publishable key}"
          export MOSAIC_SB_LOCAL_ADMIN_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          node supabase-poc/tests/beta-invite-gotrue-local.mjs
          docker exec -i "${db_containers[0]}" psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres <<'SQL'
          do $test$
          begin
            if (select count(*) from auth.users
                where email like 'mosaic-invite-%@example.org') <> 2 then
              raise exception 'Denied signup created an Auth user or invited account missing';
            end if;
          end $test$;
          SQL
      - name: Destroy disposable data
        if: always()
        run: supabase stop --no-backup || true
  hosted-preview-artifact:
    needs: core-app
    if: startsWith(github.ref, 'refs/heads/codex/1027-supabase-recovery-') || startsWith(github.ref, 'refs/heads/feature/1027-supabase-recovery-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Build isolated mosaic-dev bytes with public inputs only
        run: node scripts/build-supabase-core-preview.mjs
      # Run the real ZIP-to-prebuilt stage from exact disposable CI bytes.
      # No Vercel/API secrets, rebuild, provider writes, or alias operations.
      # This runner-local digest tests staging behavior, NOT signed GitHub
      # artifact provenance; the trusted external operator checks that later.
      - name: Stage and reject tampering of isolated Supabase CI artifact
        run: |
          set -euo pipefail
          source_dir=".mosaic/supabase-core-preview"
          stage_zip="$RUNNER_TEMP/mosaic-stage-test.zip"
          zip -q -X -j "$stage_zip" "$source_dir/config.json" "$source_dir/dist.tar.gz" "$source_dir/dist.tar.gz.sha256" "$source_dir/evidence.json" "$source_dir/inventory.json" "$source_dir/routing-evidence.json"
          zip_sha="$(sha256sum "$stage_zip" | cut -d' ' -f1)"
          staged="$RUNNER_TEMP/mosaic-supabase-staged"
          node scripts/stage-supabase-core-artifact.mjs "$stage_zip" "$GITHUB_SHA" "$zip_sha" "$staged"
          test -s "$staged/.vercel/output/config.json"
          test -s "$staged/.vercel/output/static/index.html"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const x = JSON.parse(readFileSync(process.argv[1] + "/.mosaic-staged-evidence.json"));
            if (x.status !== "STAGED_NOT_DEPLOYED" || x.deploymentAuthorized !== false ||
                x.acceptedSha !== process.env.GITHUB_SHA || x.files < 1 ||
                x.target !== "preview" || x.backend !== "supabase-cloud") process.exit(1);
          ' "$staged"
          if node scripts/stage-supabase-core-artifact.mjs "$stage_zip" "$GITHUB_SHA" "$(printf '%064d' 0)" "$RUNNER_TEMP/tampered-stage"; then
            echo "Tampered ZIP digest accepted" >&2; exit 1
          fi
          if node scripts/stage-supabase-core-artifact.mjs "$stage_zip" "$GITHUB_SHA" "$zip_sha" "$staged"; then
            echo "Existing stage destination overwritten" >&2; exit 1
          fi
      # This is deliberately a different artifact from the Appwrite receiver's.
      # Exact source canonical acceptance and lab success are required before
      # a separately authorized operator deploys these verified static bytes.
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-supabase-core-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: life-tracker/.mosaic/supabase-core-preview/*
          if-no-files-found: error
          retention-days: 7

  preview-deploy:
    # Enabling the repository variable and configuring the protected environment
    # is an explicit one-time operator action. Default: SKIPPED. NEVER Production.
    needs: hosted-preview-artifact
    if: ${{ vars.MOSAIC_SUPABASE_PREVIEW_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/feature/1027-supabase-recovery-20261020' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: mosaic-supabase-preview
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - name: Check out exact isolated Supabase candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - name: Install approved local artifact stage dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Verify canonical SHA, active branch and download exact GitHub CI artifact
        id: accept
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-supabase-preview-deploy.mjs --prepare
      - name: Stage only verified static bytes for the fixed Supabase Preview project
        env:
          ACCEPTED_ZIP: ${{ steps.accept.outputs.archive }}
          ACCEPTED_ZIP_SHA256: ${{ steps.accept.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$ACCEPTED_ZIP" && test -n "$ACCEPTED_ZIP_SHA256"
          node scripts/stage-supabase-core-artifact.mjs \
            "$ACCEPTED_ZIP" "$GITHUB_SHA" "$ACCEPTED_ZIP_SHA256" \
            "$RUNNER_TEMP/mosaic-supabase-prebuilt"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const e = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (e.status !== "STAGED_NOT_DEPLOYED" || e.deploymentAuthorized !== false ||
                e.acceptedSha !== process.env.GITHUB_SHA || e.target !== "preview" ||
                e.projectId !== "prj_jysOLDbuO9c5rP8x6Q145DVIw0fc" ||
                e.teamId !== "team_UbpudOr8jXyrDA5SdVUxVGOr" ||
                e.backend !== "supabase-cloud") process.exit(1);
          ' "$RUNNER_TEMP/mosaic-supabase-prebuilt/.mosaic-staged-evidence.json"
      - name: Publish immutable, protected Supabase Preview (never an alias or production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.MOSAIC_SUPABASE_PREVIEW_VERCEL_TOKEN }}
          EXPECTED_PREVIEW_PROJECT: ${{ vars.MOSAIC_SUPABASE_PREVIEW_PROJECT_ID }}
          ARTIFACT_DIGEST: ${{ steps.accept.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_PREVIEW_PROJECT" != "prj_jysOLDbuO9c5rP8x6Q145DVIw0fc" ||
                -z "$VERCEL_TOKEN" || ! "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Protected Preview-only Vercel environment is unconfigured" >&2
            exit 1
          fi
          npm install --global --no-audit vercel@62.7.0
          # This project has a Git rootDirectory of life-tracker. The CLI
          # validates its existence even for an already verified prebuilt.
          # Do not move, rebuild or change any authenticated static bytes.
          stage="$RUNNER_TEMP/mosaic-supabase-prebuilt"
          test -f "$stage/.vercel/output/config.json"
          test -f "$stage/.vercel/project.json"
          test ! -e "$stage/life-tracker"
          mkdir -m 700 -- "$stage/life-tracker"
          cd "$stage"
          url="$(vercel deploy --prebuilt --archive=tgz --yes --target=preview \
            --token="$VERCEL_TOKEN" --scope=team_UbpudOr8jXyrDA5SdVUxVGOr \
            --meta "mosaicSourceSha=$GITHUB_SHA" \
            --meta "mosaicBackend=supabase-cloud" \
            --meta "mosaicArtifactSha256=$ARTIFACT_DIGEST")"
          DEPLOYMENT_URL="$url" node \
            "$GITHUB_WORKSPACE/life-tracker/scripts/verify-supabase-preview-deploy.mjs" --readback
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
      - name: Report immutable Preview for signed disposable-account acceptance
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Verified immutable Supabase Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "No alias, shared environment, hosted Auth policy, dev/main or Production changes." >> "$GITHUB_STEP_SUMMARY"
