name: One-time #1875 template copy guidance

on:
  push:
    branches:
      - chatgpt/1875-parent-links-20261110
    paths:
      - .github/workflows/1875-template-copy-guidance.yml

permissions:
  contents: read

concurrency:
  group: mosaic-1875-template-copy-guidance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Add accurate personal-Project copy and routing guidance
        env:
          MOSAIC_PROJECTS_ROUTING_TOKEN: ${{ secrets.MOSAIC_PROJECTS_ROUTING_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.MOSAIC_PROJECTS_ROUTING_TOKEN;
          if (!token) throw new Error('MOSAIC_PROJECTS_ROUTING_TOKEN is missing');
          const endpoint = 'https://api.github.com/graphql';
          async function graphql(query, variables = {}) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                authorization: 'Bearer ' + token,
                accept: 'application/vnd.github+json',
                'content-type': 'application/json',
                'x-github-api-version': '2026-03-10'
              },
              body: JSON.stringify({ query, variables })
            });
            const payload = await response.json();
            if (!response.ok || payload.errors?.length) {
              throw new Error('GitHub GraphQL rejected the operation (HTTP ' + response.status + ')');
            }
            return payload.data;
          }
          const expectedId = 'PVT_kwHOCQsqas4BqxPc';
          const query = 'query { user(login: "carlers") { projectV2(number: 2) { id title public closed readme items(first: 1) { totalCount } } } }';
          const project = (await graphql(query)).user?.projectV2;
          if (!project || project.id !== expectedId ||
              project.title !== 'Mosaic — Feature Project Template' ||
              project.public !== false || project.closed || project.items.totalCount !== 0 ||
              typeof project.readme !== 'string' || !project.readme.startsWith('# Mosaic Feature Project Template')) {
            throw new Error('Exact private, empty Project #2 preflight failed');
          }
          const section = [
            '',
            '## Reusing this template',
            '',
            'This is a private personal-account Project blueprint. GitHub’s organization-template toggle is not available for user-owned Projects, but any existing Project can be copied:',
            '1. Open this Project and choose **… → Make a copy**.',
            '2. Select your personal account as the new Project owner, enter a name, and choose **Copy project**.',
            '3. GitHub copies views, custom fields, draft issues and their field values, configured workflows (except auto-add workflows), and insights. It does not copy issue items, collaborators, or repository/team links. Reconnect the intended repository and collaborators after copying.',
            '4. The current Mosaic issue-intake workflow is allowlisted to Projects #1, #3, #4, and #5. A copied Project is not automatically added to that routing. Before routing new issues to a copied Project, add an exact reviewed area-label → Project-ID mapping to the default-branch intake workflow and verify it with a disposable issue. Until then, add issues manually.',
            ''
          ].join('\n');
          if (project.readme.includes('## Reusing this template')) {
            console.log('TEMPLATE_GUIDANCE=ALREADY_PRESENT');
          } else {
            const readme = project.readme.trimEnd() + section;
            const mutation = 'mutation($id: ID!, $readme: String!) { updateProjectV2(input: { projectId: $id, readme: $readme }) { projectV2 { id title public readme } } }';
            const changed = await graphql(mutation, { id: expectedId, readme });
            const updated = changed.updateProjectV2?.projectV2;
            if (!updated || updated.id !== expectedId || updated.public !== false ||
                updated.readme !== readme || !updated.readme.includes('## Reusing this template')) {
              throw new Error('Template README write/readback failed');
            }
            console.log('TEMPLATE_GUIDANCE=UPDATED_AND_VERIFIED');
          }
          const final = (await graphql(query)).user?.projectV2;
          if (!final || final.id !== expectedId || final.public !== false ||
              final.items.totalCount !== 0 || !final.readme.includes('## Reusing this template')) {
            throw new Error('Final template readback failed');
          }
          console.log('FINAL_READBACK=PASS; Project #2 private, empty, reusable copy instructions and routing caveat present');
          NODE