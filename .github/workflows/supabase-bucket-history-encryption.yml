name: Supabase Bucket History Encryption Lab

on:
  push:
    branches:
      - 'chatgpt/1027-history-encrypted-ledger-*'
      - 'chatgpt/1027-owner-history-decrypt-*'
      - 'feature/1027-supabase-recovery-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-bucket-history-encryption-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-history:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated age executable
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq age
      - name: Prove synthetic owner-only archive encryption and exact decrypt
        run: |
          node --check supabase-poc/encrypted-owner-history.mjs
          node --check supabase-poc/verify-encrypted-owner-history.mjs
          node --check supabase-poc/tests/encrypted-owner-history-lab.mjs
          node supabase-poc/tests/encrypted-owner-history-lab.mjs
