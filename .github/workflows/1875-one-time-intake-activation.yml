name: One-time Mosaic issue intake activation

# Scoped temporary workflow. Do not promote or keep after verified execution.
on:
  push:
    branches:
      - chatgpt/1875-enable-project-intake-20261109
    paths:
      - .github/workflows/1875-one-time-intake-activation.yml

permissions:
  contents: read
  actions: write

jobs:
  activate:
    if: github.repository == 'carlers/mosaic-life-tracker' && github.ref == 'refs/heads/chatgpt/1875-enable-project-intake-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify exact accepted main and one-time authorization scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/carlers/mosaic-life-tracker/branches/main" --jq '.commit.sha')"
          test "$current" = "ec9aae54e095a70581a9f86d79bd64c992ee83a7" || { echo "::error::Main drift, aborting activation"; exit 1; }
          echo "MAIN_INTAKE_EXACT_SHA=VERIFIED"

      - name: Set only MOSAIC_PROJECT_INTAKE_ENABLED to true
        shell: bash
        env:
          PROJECT_AUTH_TOKEN: ${{ secrets.MOSAIC_PROJECTS_ROUTING_TOKEN }}
          GH_WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = 'https://api.github.com/repos/carlers/mosaic-life-tracker/actions/variables';
          const name = 'MOSAIC_PROJECT_INTAKE_ENABLED';
          const headers = token => ({
            Authorization: 'Bearer ' + token,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'mosaic-one-time-project-intake-activation'
          });
          async function call(token, method, suffix, body) {
            return fetch(base + suffix, {
              method, headers: { ...headers(token), ...(body ? { 'Content-Type': 'application/json' } : {}) },
              ...(body ? { body: JSON.stringify(body) } : {}),
              signal: AbortSignal.timeout(15000)
            });
          }
          const tokens = [
            process.env.PROJECT_AUTH_TOKEN,
            process.env.GH_WORKFLOW_TOKEN
          ].filter(Boolean);
          for (const token of tokens) {
            const existing = await call(token, 'GET', '/' + name);
            if (existing.status !== 200 && existing.status !== 404) continue;
            const body = existing.status === 200 ? { value: 'true' } : { name, value: 'true' };
            const update = await call(token, existing.status === 200 ? 'PATCH' : 'POST',
              existing.status === 200 ? '/' + name : '', body);
            if (![201, 204].includes(update.status)) continue;
            const verify = await call(token, 'GET', '/' + name);
            if (verify.status !== 200) throw Error('Variable update response not independently readable');
            const data = await verify.json();
            if (data.name !== name || data.value !== 'true') throw Error('Variable readback mismatch');
            console.log('MOSAIC_PROJECT_INTAKE_ENABLED=VERIFIED_TRUE');
            process.exit(0);
          }
          throw Error('No configured token can manage repository Actions variables (requires Variables:write). No activation change verified.');
          NODE
