name: Scratch Historical Consumer Evidence (temporary)
on:
  push:
    branches:
      - chatgpt/526-validation-20261015
    paths:
      - .github/workflows/scratch-compat-proof.yml
permissions:
  contents: read
jobs:
  compatibility-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch immutable historical active Preview commits
        run: |
          git -C .. fetch --no-tags origin refs/heads/dev refs/heads/feature/diary-408 refs/heads/feature/notifications-682
          git -C .. cat-file -e "dc24b1db7c7f10eb50922a8b263a9217a5c6aa7a^{commit}"
          git -C .. cat-file -e "d29340395c82cff91a5a1f9fecc582d727fb320d^{commit}"
          git -C .. cat-file -e "0549118001d448864deb5585c7679e155c011005^{commit}"
      - name: Install verified dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Current dev consumer must accept candidate row shapes
        run: npm run appwrite:preview:compat -- --consumer-sha dc24b1db7c7f10eb50922a8b263a9217a5c6aa7a
      - name: Older Diary consumer must flag unknown column incompatibility
        shell: bash
        run: |
          set +e
          output="$(npm run appwrite:preview:compat -- --consumer-sha d29340395c82cff91a5a1f9fecc582d727fb320d 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          echo "$output" | grep -E 'diary:|messages:'
      - name: Older Notifications consumer must flag unknown column incompatibility
        shell: bash
        run: |
          set +e
          output="$(npm run appwrite:preview:compat -- --consumer-sha 0549118001d448864deb5585c7679e155c011005 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          echo "$output" | grep -E 'diary:|messages:'
