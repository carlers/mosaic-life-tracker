name: Publish Production Release

on:
  workflow_run:
    workflows: ['Quality Gate']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

# Only this narrowly scoped, trusted default-branch job can create tags/releases.
permissions:
  contents: write
  checks: read
  statuses: read
  pull-requests: read

concurrency:
  group: mosaic-production-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Verify production and publish GitHub Release
    if: >-
      github.repository == 'carlers/mosaic-life-tracker' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    defaults:
      run:
        working-directory: life-tracker
    steps:
      - name: Check out exact accepted main candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0 # Source dev first-parent history is required for verified version milestones.
          persist-credentials: false
          sparse-checkout: |
            life-tracker
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish only after verified main CI and live production
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-production-release.mjs
