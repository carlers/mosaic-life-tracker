name: Supabase Hosted Email Policy Readiness
# Read-only isolated Scratch Auth config; never configure SMTP, send mail,
# create users, deploy, or use the Production provider.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/1027-supabase-recovery-20261020
    paths:
      - .github/workflows/supabase-hosted-email-policy.yml

permissions:
  contents: read

concurrency:
  group: mosaic-supabase-hosted-email-policy
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'carlers/mosaic-life-tracker' && github.ref == 'refs/heads/feature/1027-supabase-recovery-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned source and safe read-only auditor
        working-directory: life-tracker
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/feature/1027-supabase-recovery-20261020'
          node --check supabase-poc/hosted-email-audit.mjs
          node --check supabase-poc/email-policy.mjs
          echo MOSAIC_HOSTED_EMAIL_AUDIT_EXACT_SOURCE_PREFLIGHT_PASS

  policy:
    name: Read-only email settings with protected Scratch credential
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: mosaic-supabase-hosted-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require scoped protected secret without showing value
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.MOSAIC_SUPABASE_HOSTED_MGMT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || "$GITHUB_REF" != 'refs/heads/feature/1027-supabase-recovery-20261020' ]]; then
            echo MOSAIC_HOSTED_EMAIL_AUDIT_PROTECTED_CREDENTIAL_MISSING >&2
            exit 1
          fi
      - name: Read Auth policy and print only allowlisted boolean findings
        working-directory: life-tracker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.MOSAIC_SUPABASE_HOSTED_MGMT_TOKEN }}
          NODE_USE_ENV_PROXY: '1'
        run: |
          set -euo pipefail
          node supabase-poc/hosted-email-audit.mjs --inspect
