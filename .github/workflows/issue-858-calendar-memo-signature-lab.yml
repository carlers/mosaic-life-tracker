name: Issue 858 Calendar Signature Memo Lab
# NON-DEPLOYING synthetic instrumentation branch only.
on:
  push:
    branches:
      - chatgpt/858-calendar-memo-signature-lab-20261018
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    defaults:
      run:
        working-directory: life-tracker
    env:
      VERCEL_ENV: preview
      VITE_APPWRITE_PROJECT_ID: 6a96e82d000d1310b3be
      VITE_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      VITE_APPWRITE_MESSAGE_ACTION_FUNCTION_ID: 6aa8057f002a4c306fdd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run test:browser:prepare
      - run: tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify TypeScript and offline-ready production build
        run: npm run build
      - name: Start isolated development harness
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/mosaic-858-reconcile-lab.log 2>&1 &
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:4173/tests/e2e/interaction-contract.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mosaic-858-reconcile-lab.log
          exit 1
      - name: Interleaved 2x CPU React and layout A/B
        run: tests/e2e/node_modules/.bin/playwright test tests/e2e/calendar-memo-signature-lab.spec.mjs --config=playwright.config.mjs --reporter=line
      - name: Upload errors only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-858-memo-debug
          path: life-tracker/test-results/**
          if-no-files-found: ignore
          retention-days: 7
