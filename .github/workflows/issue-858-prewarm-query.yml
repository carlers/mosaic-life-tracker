name: Issue 858 Cold Owner Query Prewarm Lab
# Diagnostic-only synthetic owner account, no deployment.
on:
  push:
    branches:
      - chatgpt/858-prewarm-query-lab-20261018
permissions:
  contents: read
jobs:
  prewarm-query:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: life-tracker
    env:
      VERCEL_ENV: preview
      VITE_APPWRITE_PROJECT_ID: 6a96e82d000d1310b3be
      VITE_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      VITE_APPWRITE_MESSAGE_ACTION_FUNCTION_ID: 6aa8057f002a4c306fdd
      VITE_MOSAIC_858_SCALING_LAB: '1'
      MOSAIC_AUDIT_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm install --prefix tests/e2e --package-lock=false --no-audit --no-fund
      - run: tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify diagnostic TypeScript, PWA, output size
        run: npm run build
      - name: Measure true early query prewarm in cold cached-PWA launches
        run: tests/e2e/node_modules/.bin/playwright test tests/e2e/startup-structural-scaling.spec.mjs --config=playwright.mobile-audit.config.mjs --reporter=line
      - name: Archive per-variant launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-858-owner-query-prewarm
          path: |
            life-tracker/.mosaic/slow-startup/owner-prewarm*.json
            life-tracker/test-results/**
          if-no-files-found: warn
          retention-days: 14
