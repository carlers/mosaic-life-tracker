name: GitHub Projects Admin MCP
on:
  push:
    paths:
      - 'life-tracker/github-projects-admin-mcp/**'
      - '.github/workflows/github-projects-admin-ci.yml'
  pull_request:
    paths:
      - 'life-tracker/github-projects-admin-mcp/**'
      - '.github/workflows/github-projects-admin-ci.yml'
permissions:
  contents: read
jobs:
  admin-mcp:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: life-tracker/github-projects-admin-mcp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: life-tracker/github-projects-admin-mcp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
