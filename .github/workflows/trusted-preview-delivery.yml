# TRUST BOUNDARY: this file runs only from default main after a completed
# official push Quality Gate. It never imports or executes candidate branch code.
# #592: read-only PREBUILT shadow; no environment, provider token, POST or alias.
name: Trusted Preview Delivery

on:
  workflow_run:
    workflows: [Quality Gate]
    types: [completed]
    branches:
      - fix/592-trusted-archive-20261014

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  trusted_preview:
    name: trusted-preview-receiver
    if: >-
      ${{ github.repository == 'carlers/mosaic-life-tracker' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'carlers/mosaic-life-tracker' &&
      github.event.workflow_run.head_branch == 'fix/592-trusted-archive-20261014' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: trusted-prebuilt-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted main only (no candidate scripts)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Use built-in Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate exact completed canonical CI and SHA256 artifact (no provider writes)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOSAIC_TRUSTED_PREVIEW_ENABLED: 'true'
          MOSAIC_TRUSTED_PREVIEW_CREATE_ENABLED: 'false'
          MOSAIC_TRUSTED_PREVIEW_ALIAS_ENABLED: 'false'
        run: node life-tracker/scripts/run-trusted-prebuilt-receiver.mjs


  # A separate, independently default-OFF credentialed job. It does not run
  # until the protected read-only shadow passes for this exact canonical run.
  # NEVER turn on before canary-only Git auto-deployment is disabled, the
  # provider project identity has been checked, and rollback is prepared.
  prebuilt_writer:
    name: trusted-prebuilt-writer
    needs: trusted_preview
    if: >-
      ${{ needs.trusted_preview.result == 'success' &&
      github.repository == 'carlers/mosaic-life-tracker' &&
      github.event.workflow_run.head_branch == 'fix/592-trusted-archive-20261014' &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.MOSAIC_PREBUILT_WRITER_ENABLED == 'true' &&
      vars.MOSAIC_TRUSTED_PREVIEW_CREATE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: trusted-prebuilt-writer-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    environment: mosaic-preview-auto
    steps:
      - name: Check out only main-trusted writer source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Setup trusted Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install fixed Vercel CLI without provider secrets or install scripts
        run: npm install --prefix "$RUNNER_TEMP/mosaic-vercel-cli" --ignore-scripts --no-audit --no-fund --no-save --package-lock=false vercel@63.1.2
      - name: Revalidate exact CI and upload already verified static bytes to Preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.MOSAIC_PREVIEW_AUTO_VERCEL_TOKEN }}
          MOSAIC_PREBUILT_WRITER_ENABLED: ${{ vars.MOSAIC_PREBUILT_WRITER_ENABLED }}
          MOSAIC_TRUSTED_PREVIEW_ENABLED: 'true'
          MOSAIC_TRUSTED_PREVIEW_CREATE_ENABLED: ${{ vars.MOSAIC_TRUSTED_PREVIEW_CREATE_ENABLED }}
          MOSAIC_TRUSTED_PREVIEW_ALIAS_ENABLED: ${{ vars.MOSAIC_TRUSTED_PREVIEW_ALIAS_ENABLED }}
          MOSAIC_TRUSTED_VERCEL_BIN: ${{ runner.temp }}/mosaic-vercel-cli/node_modules/.bin/vercel
        run: node life-tracker/scripts/run-trusted-prebuilt-writer.mjs
