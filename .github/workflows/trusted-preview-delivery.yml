# TRUST BOUNDARY: only effective from default branch main. Never
# checkout, execute or import triggering-branch code in this privileged job.
name: Trusted Preview Delivery

on:
  workflow_run:
    workflows: [Quality Gate]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  trusted_preview:
    name: trusted-preview-receiver
    if: >-
      ${{ github.repository == 'carlers/mosaic-life-tracker' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'carlers/mosaic-life-tracker' &&
      github.event.workflow_run.head_branch == 'fix/workflow-build-parity-592-20261012' &&
      vars.MOSAIC_TRUSTED_PREVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: trusted-preview-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    environment: mosaic-preview-auto
    steps:
      - name: Checkout trusted main workflow and scripts only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Use built-in Node runtime from the trusted runner
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify completed same-SHA CI and deploy using trusted Git-source API
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.MOSAIC_PREVIEW_AUTO_VERCEL_TOKEN }}
          MOSAIC_TRUSTED_PREVIEW_ENABLED: ${{ vars.MOSAIC_TRUSTED_PREVIEW_ENABLED }}
          MOSAIC_TRUSTED_PREVIEW_ALIAS_ENABLED: ${{ vars.MOSAIC_TRUSTED_PREVIEW_ALIAS_ENABLED }}
          MOSAIC_TRUSTED_PREVIEW_CREATE_ENABLED: ${{ vars.MOSAIC_TRUSTED_PREVIEW_CREATE_ENABLED }}
        run: node life-tracker/scripts/run-trusted-preview-receiver.mjs
