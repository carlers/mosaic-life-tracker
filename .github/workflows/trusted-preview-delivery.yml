# TRUST BOUNDARY: this file runs only from default main after a completed
# official push Quality Gate. It never imports or executes candidate branch code.
# #592: read-only PREBUILT shadow; no environment, provider token, POST or alias.
name: Trusted Preview Delivery

on:
  workflow_run:
    workflows: [Quality Gate]
    types: [completed]
    branches:
      - fix/592-trusted-archive-20261014
      - feature/592-prebuilt-pilot-20261014

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  trusted_preview:
    name: trusted-preview-receiver
    if: >-
      ${{ github.repository == 'carlers/mosaic-life-tracker' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'carlers/mosaic-life-tracker' &&
      (github.event.workflow_run.head_branch == 'fix/592-trusted-archive-20261014' ||
      github.event.workflow_run.head_branch == 'feature/592-prebuilt-pilot-20261014') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: trusted-prebuilt-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted main only (no candidate scripts)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Use built-in Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate exact completed canonical CI and SHA256 artifact (no provider writes)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOSAIC_TRUSTED_PREVIEW_ENABLED: 'true'
          MOSAIC_TRUSTED_PREVIEW_CREATE_ENABLED: 'false'
          MOSAIC_TRUSTED_PREVIEW_ALIAS_ENABLED: 'false'
        run: node life-tracker/scripts/run-trusted-prebuilt-receiver.mjs

  trusted_prebuilt_deploy:
    name: trusted-prebuilt-deploy
    needs: trusted_preview
    # OFF unless explicitly enabled after a reviewed green/red/stale canary.
    if: >-
      ${{ needs.trusted_preview.result == 'success' &&
      github.repository == 'carlers/mosaic-life-tracker' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'fix/592-trusted-archive-20261014' ||
      github.event.workflow_run.head_branch == 'feature/592-prebuilt-pilot-20261014') &&
      vars.MOSAIC_TRUSTED_PREVIEW_CREATE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mosaic-preview-auto
    permissions:
      contents: read
      actions: read
      checks: read
    concurrency:
      group: trusted-prebuilt-deploy-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Check out main-owned scripts only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Use exact verified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pinned trusted Vercel CLI without deployment credentials
        run: npm install --global vercel@62.7.0
      - name: Verify accepted artifact again, then deploy only static prebuilt Preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.MOSAIC_PREVIEW_AUTO_VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_jysOLDbuO9c5rP8x6Q145DVIw0fc
          VERCEL_ORG_ID: team_UbpudOr8jXyrDA5SdVUxVGOr
          VERCEL_ENV: preview
          MOSAIC_TRUSTED_PREVIEW_ENABLED: 'true'
          MOSAIC_TRUSTED_PREVIEW_CREATE_ENABLED: ${{ vars.MOSAIC_TRUSTED_PREVIEW_CREATE_ENABLED }}
          MOSAIC_TRUSTED_PREVIEW_ALIAS_ENABLED: 'false'
        run: node life-tracker/scripts/run-trusted-prebuilt-writer.mjs
