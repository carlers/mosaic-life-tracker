name: Issue 858 Slow-Startup Lab

# One isolated, credential-free performance experiment. Not a permanent
# release gate and never launched by main/dev or unrelated branches.
on:
  push:
    branches:
      - chatgpt/858-slow-network-lab-20261017
      - chatgpt/858-rolldown-grouped-20261017

permissions:
  contents: read

jobs:
  cold-and-warm-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: life-tracker
    env:
      VERCEL_ENV: preview
      VITE_APPWRITE_PROJECT_ID: 6a96e82d000d1310b3be
      VITE_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      VITE_APPWRITE_MESSAGE_ACTION_FUNCTION_ID: 6aa8057f002a4c306fdd
      MOSAIC_AUDIT_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm install --prefix tests/e2e --package-lock=false --no-audit --no-fund
      - run: tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - run: npm run build
      - name: Measure production-output slow startup
        run: tests/e2e/node_modules/.bin/playwright test tests/e2e/startup-slow-network.spec.mjs --config=playwright.mobile-audit.config.mjs --reporter=line
      - name: Save current-size and cold-start baseline
        if: github.ref_name == 'chatgpt/858-rolldown-grouped-20261017'
        run: |
          mv .mosaic/slow-startup/slow-startup.json .mosaic/slow-startup/group-baseline.json
          MOSAIC_AUDIT_OUTPUT_DIR=.mosaic/slow-startup/baseline npm run size:report
      - name: Build entries-aware grouped chunks
        if: github.ref_name == 'chatgpt/858-rolldown-grouped-20261017'
        run: |
          node scripts/experimental-group-chunks.mjs
          npm run build
      - name: Measure grouped-candidate startup and size
        if: github.ref_name == 'chatgpt/858-rolldown-grouped-20261017'
        run: |
          tests/e2e/node_modules/.bin/playwright test tests/e2e/startup-slow-network.spec.mjs --config=playwright.mobile-audit.config.mjs --reporter=line
          mv .mosaic/slow-startup/slow-startup.json .mosaic/slow-startup/group-candidate.json
          MOSAIC_AUDIT_OUTPUT_DIR=.mosaic/slow-startup/candidate npm run size:report
      - name: Archive synthetic timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-858-slow-startup
          path: |
            life-tracker/.mosaic/slow-startup/slow-startup.json
            life-tracker/.mosaic/slow-startup/group-baseline.json
            life-tracker/.mosaic/slow-startup/group-candidate.json
            life-tracker/.mosaic/slow-startup/baseline/size-snapshot.json
            life-tracker/.mosaic/slow-startup/candidate/size-snapshot.json
          if-no-files-found: warn
          retention-days: 7
