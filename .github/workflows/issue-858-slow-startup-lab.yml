name: Issue 858 Slow-Startup Lab

# One isolated, credential-free performance experiment. Not a permanent
# release gate and never launched by main/dev or unrelated branches.
on:
  push:
    branches:
      - chatgpt/858-slow-network-lab-20261017
      - chatgpt/858-defer-neighbor-preload-20261017

permissions:
  contents: read

jobs:
  cold-and-warm-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: life-tracker
    env:
      VERCEL_ENV: preview
      VITE_APPWRITE_PROJECT_ID: 6a96e82d000d1310b3be
      VITE_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      VITE_APPWRITE_MESSAGE_ACTION_FUNCTION_ID: 6aa8057f002a4c306fdd
      MOSAIC_AUDIT_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm install --prefix tests/e2e --package-lock=false --no-audit --no-fund
      - run: tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - run: npm run build
      - name: Measure production-output slow startup
        run: tests/e2e/node_modules/.bin/playwright test tests/e2e/startup-slow-network.spec.mjs --config=playwright.mobile-audit.config.mjs --reporter=line
      - name: Preserve baseline report
        if: github.ref_name == 'chatgpt/858-defer-neighbor-preload-20261017'
        run: mv .mosaic/slow-startup/slow-startup.json .mosaic/slow-startup/neighbor-baseline.json
      - name: Build isolated no-early-neighbor candidate
        if: github.ref_name == 'chatgpt/858-defer-neighbor-preload-20261017'
        run: |
          node scripts/experimental-no-early-neighbor.mjs
          npm run build
      - name: Measure candidate no-early-neighbor slow startup
        if: github.ref_name == 'chatgpt/858-defer-neighbor-preload-20261017'
        run: |
          tests/e2e/node_modules/.bin/playwright test tests/e2e/startup-slow-network.spec.mjs --config=playwright.mobile-audit.config.mjs --reporter=line
          mv .mosaic/slow-startup/slow-startup.json .mosaic/slow-startup/neighbor-candidate.json
      - name: Validate and summarize paired startup results
        if: github.ref_name == 'chatgpt/858-defer-neighbor-preload-20261017'
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const base = '.mosaic/slow-startup/';
          const a = JSON.parse(readFileSync(base + 'neighbor-baseline.json', 'utf8'));
          const b = JSON.parse(readFileSync(base + 'neighbor-candidate.json', 'utf8'));
          const summary = {};
          for (const mode of ['fast-assets', 'slow-assets', 'pwa-cached-assets']) {
            if (!a.summary?.[mode] || !b.summary?.[mode]) {
              throw new Error('Missing paired scenario: ' + mode);
            }
            const current = a.summary[mode].homeReadyMedianMs;
            const candidate = b.summary[mode].homeReadyMedianMs;
            if (!Number.isFinite(current) || !Number.isFinite(candidate)) {
              throw new Error('Invalid timing in scenario ' + mode);
            }
            summary[mode] = {
              currentHomeReadyMs: current,
              candidateHomeReadyMs: candidate,
              deltaMs: candidate - current,
            };
          }
          for (const sample of [...a.rows, ...b.rows]) {
            if (!(sample.heldAppwriteRequests > 0)) {
              throw new Error('Backend not held during local Home');
            }
          }
          console.log('MOSAIC_858_NEIGHBOR_AB ' + JSON.stringify(summary));
          writeFileSync(base + 'neighbor-comparison.json',
            JSON.stringify({ sourceSha: a.sourceSha, summary }, null, 2) + '\\n');
          JS
      - name: Archive synthetic timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-858-slow-startup
          path: |
            life-tracker/.mosaic/slow-startup/slow-startup.json
            life-tracker/.mosaic/slow-startup/neighbor-baseline.json
            life-tracker/.mosaic/slow-startup/neighbor-candidate.json
            life-tracker/.mosaic/slow-startup/neighbor-comparison.json
          if-no-files-found: warn
          retention-days: 7
