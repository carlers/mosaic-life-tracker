name: One-time Project issue routing acceptance

# Disposable workflow: only runs once from dedicated test task branch.
# Checkout pins audited dev source; never ships to main/dev.
on:
  push:
    branches:
      - chatgpt/1875-project-intake-e2e-20261109
    paths:
      - .github/workflows/1875-project-intake-e2e.yml

permissions:
  contents: read
  issues: read

jobs:
  route:
    if: github.repository == 'carlers/mosaic-life-tracker' && github.ref == 'refs/heads/chatgpt/1875-project-intake-e2e-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 1f5ec7ae8524747e4e7c93ba3b00f4952449d18c
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate two private destinations and idempotent mutation
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
          MOSAIC_PROJECTS_ROUTING_TOKEN: ${{ secrets.MOSAIC_PROJECTS_ROUTING_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { routeIssue } from './life-tracker/scripts/project-intake/route-issue.mjs';
          const event = {
            action: 'labeled',
            repository: { full_name: 'carlers/mosaic-life-tracker' },
            issue: { number: 1885, state: 'open' }
          };
          const args = {
            event, eventName: 'issues',
            repository: 'carlers/mosaic-life-tracker',
            readToken: process.env.GH_READ_TOKEN,
            projectToken: process.env.MOSAIC_PROJECTS_ROUTING_TOKEN
          };
          const first = await routeIssue(args);
          const repeat = await routeIssue(args);
          if (first.issue !== 1885 ||
              JSON.stringify(first.projects) !== '[1,3]' ||
              JSON.stringify(repeat.projects) !== '[1,3]') {
            throw Error('Unexpected project routing result');
          }
          console.log('LIVE_PROJECT_INTAKE_PROJECTS_1_3=PASS');
          console.log('LIVE_PROJECT_INTAKE_IDEMPOTENT_REPLAY=PASS');
          NODE
