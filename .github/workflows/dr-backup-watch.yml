name: DR Backup Watch

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DR_BACKUP_WATCH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: life-tracker
    env:
      R2_ACCOUNT_ID: ${{ secrets.DR_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.DR_R2_RECOVERY_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.DR_R2_RECOVERY_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.DR_R2_BUCKET }}
      DR_PREFIX: mosaic-dr/v1
      DR_MAX_AGE_HOURS: '36'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check newest completed DR snapshot
        run: node scripts/dr-watch.mjs

  # Oracle's encrypted application-data snapshots are separate from legacy
  # Appwrite Cloud snapshots. Never enable this before an independently
  # verified Oracle restore and approved Production schedule.
  oracle-watch:
    if: ${{ vars.DR_ORACLE_WATCH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: life-tracker
    env:
      R2_ACCOUNT_ID: ${{ secrets.DR_ORACLE_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.DR_ORACLE_R2_RECOVERY_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.DR_ORACLE_R2_RECOVERY_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.DR_ORACLE_R2_BUCKET }}
      DR_PREFIX: mosaic-oracle-dr/v1
      DR_MAX_AGE_HOURS: '36'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check newest completed Oracle DR snapshot
        run: node scripts/dr-watch.mjs
