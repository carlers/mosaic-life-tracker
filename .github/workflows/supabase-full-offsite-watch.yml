name: Supabase Scratch Unified Offsite Recovery Watch

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type VERIFY_SCRATCH_OFFSITE for one manual run; schedules remain disabled'
        required: true
        type: string

permissions:
  contents: read

jobs:
  watch-full-offsite:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (
          (github.event_name == 'schedule' && vars.SUPABASE_DR_ENABLED == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'VERIFY_SCRATCH_OFFSITE')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: mosaic-supabase-dr
    defaults:
      run:
        working-directory: life-tracker
    env:
      SUPABASE_DR_SOURCE_PROJECT: hcxtiifzxoaflhjgoglb
      SUPABASE_DR_RECOVERY_PROFILE: 'ten-personal-bucket-links'
      SUPABASE_DR_R2_ACCOUNT_ID: ${{ secrets.SUPABASE_DR_R2_ACCOUNT_ID }}
      SUPABASE_DR_R2_ACCESS_KEY_ID: ${{ secrets.SUPABASE_DR_R2_READ_ACCESS_KEY_ID }}
      SUPABASE_DR_R2_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_DR_R2_READ_SECRET_ACCESS_KEY }}
      SUPABASE_DR_R2_BUCKET: ${{ vars.SUPABASE_DR_R2_BUCKET }}
    steps:
      # Never execute main-branch application code for this isolated DR pilot.
      # Pin the approved, CI-accepted Scratch-only recovery implementation.
      - uses: actions/checkout@v4
        with:
          ref: 8d161c958864283d8a50c454f35dc4e27f9d02cc
          persist-credentials: false
      - name: Verify exact recovery source SHA and dedicated R2 destination
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8d161c958864283d8a50c454f35dc4e27f9d02cc'
          test "$SUPABASE_DR_SOURCE_PROJECT" = 'hcxtiifzxoaflhjgoglb'
          test "$SUPABASE_DR_RECOVERY_PROFILE" = 'ten-personal-bucket-links'
          test "$SUPABASE_DR_R2_BUCKET" = 'mosaic-supabase-backups'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independently recheck ALL R2 PostgreSQL and media ciphertext bytes and 36h freshness
        run: node supabase-poc/unified-offsite.mjs --watch
