name: Issue 858 v0.29.8 Exact Calendar and Todo Scale Audit

# Read-only, synthetic, non-deploying exact source calibration. DO NOT merge.
on:
  push:
    branches: [chatgpt/858-v0298-exact-scale-audit-20261017]
    paths:
      - '.github/workflows/issue-858-v0298-exact-scale-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: life-tracker
    env:
      VERCEL_ENV: preview
      VITE_APPWRITE_PROJECT_ID: 6a96e82d000d1310b3be
      VITE_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      VITE_APPWRITE_MESSAGE_ACTION_FUNCTION_ID: 6aa8057f002a4c306fdd
      MOSAIC_AUDIT_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: life-tracker/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm install --prefix tests/e2e --package-lock=false --no-audit --no-fund
      - run: tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify exact v0.29.8 source and PWA build safety
        run: |
          test "$(node -p 'require("./package.json").version')" = "0.29.8"
          npm run build
          node scripts/complete-precache-sizes.mjs
          node scripts/check-service-worker.mjs
          node scripts/check-build-asset-fingerprint.mjs
      - name: Synthetic cached PWA Calendar and Todo scale, offline and slow-online
        run: tests/e2e/node_modules/.bin/playwright test tests/e2e/startup-local-mount-prototype.spec.mjs --config=playwright.mobile-audit.config.mjs --reporter=line
      - name: Archive raw local-only startup measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-858-v0298-exact-scale
          path: |
            life-tracker/.mosaic/slow-startup/calendar-volume-*.json
            life-tracker/test-results/**
          if-no-files-found: warn
          retention-days: 14
