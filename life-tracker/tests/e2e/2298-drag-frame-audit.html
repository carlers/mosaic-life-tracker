<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Anonymous frame audit contract</title></head>
<body>
<div data-testid="calendar-day-side-panel" style="width:420px; margin-left:340px; margin-top:130px">
 <div data-testid="day-slide">
  <div data-task-id="synthetic_task"><button type="button" aria-label="Sensitive diary content must never be copied">Drag synthetic task</button></div>
  <div class="mosaic-category-pill"><span data-category-drag-handle>Drag category</span></div>
 </div>
</div>
<script>
(function(){
 const mode=new URLSearchParams(location.search).get('visualMode');
 if(!mode)return;
 const anchor=document.querySelector('[data-task-id]');
 const overlay=document.createElement('div');
 overlay.dataset.taskDragOverlay='true';
 const rect=anchor.getBoundingClientRect();
 Object.assign(overlay.style,{position:'fixed',left:rect.left+'px',top:rect.top+'px',width:'130px',height:'24px',pointerEvents:'none'});
 document.body.append(overlay);
 if(mode==='follow'){
  let origin=null;
  window.addEventListener('pointerdown',e=>{origin={x:e.clientX,y:e.clientY};},true);
  window.addEventListener('pointermove',e=>{
   if(origin)overlay.style.transform='translate3d('+
     (e.clientX-origin.x)+'px,'+(e.clientY-origin.y)+'px,0)';
  },true);
  window.addEventListener('pointerup',()=>{origin=null;},true);
 }
})();
</script>
<script defer src="/2298-drag-frame-audit.js"></script>
</body></html>
