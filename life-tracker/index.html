<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  
  <!-- PWA & iOS Meta Tags -->
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="An offline-first, local-first life tracker PWA." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mosaic" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  
  <title>Mosaic | Life Tracker</title>
</head>
<body class="bg-[#111111] text-white">
  <div id="root"></div>
  <!-- Read-only opt-in drag performance diagnostic; never loaded normally. -->
  <script>
    if (new URLSearchParams(location.search).get('mosaicDragProbe') === '1') {
      const diagnostic = document.createElement('script');
      diagnostic.src = '/diagnostics/drag-performance.js';
      document.head.append(diagnostic);
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
